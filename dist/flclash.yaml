# bridge 订阅配置 —— 由 build.py 生成，请勿直接编辑
# 生成时间: 2026-11-05
# 规则说明见 https://github.com/YOUR_GITHUB_USER/bridge/blob/main/RULES.md

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: off
global-client-fingerprint: chrome

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxies: []   # 节点由私有配置注入，规则库本身不含节点

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "节点选择"
      - DIRECT

rule-providers:
  fix-direct:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USER/bridge/main/rule/fix-direct.yaml"
    path: ./ruleset/fix-direct.yaml
    interval: 86400
  fix-proxy:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USER/bridge/main/rule/fix-proxy.yaml"
    path: ./ruleset/fix-proxy.yaml
    interval: 86400
  ai:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USER/bridge/main/rule/ai.yaml"
    path: ./ruleset/ai.yaml
    interval: 86400
  dev:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USER/bridge/main/rule/dev.yaml"
    path: ./ruleset/dev.yaml
    interval: 86400
  social:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USER/bridge/main/rule/social.yaml"
    path: ./ruleset/social.yaml
    interval: 86400
  media:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USER/bridge/main/rule/media.yaml"
    path: ./ruleset/media.yaml
    interval: 86400
  cloud:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USER/bridge/main/rule/cloud.yaml"
    path: ./ruleset/cloud.yaml
    interval: 86400
  apple:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USER/bridge/main/rule/apple.yaml"
    path: ./ruleset/apple.yaml
    interval: 86400
  cn:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USER/bridge/main/rule/cn.yaml"
    path: ./ruleset/cn.yaml
    interval: 86400

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - RULE-SET,fix-direct,DIRECT
  - RULE-SET,fix-proxy,PROXY
  - RULE-SET,ai,PROXY
  - RULE-SET,dev,PROXY
  - RULE-SET,social,PROXY
  - RULE-SET,media,PROXY
  - RULE-SET,cloud,PROXY
  - RULE-SET,apple,DIRECT
  - RULE-SET,cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
